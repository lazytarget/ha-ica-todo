---
refresh_all:

refresh_shopping_lists:
  fields:
    integration:
      name: "ICA Account"
      description: "The ICA account to refresh. Defaults to all accounts"
      required: false
      selector:
        config_entry:
          integration: ica

get_recipe:
  # target:
  #   entity:
  #     integration: ica
  #     domain: todo
  fields:
    recipe_id:
      name: "Recipe id"
      description: "The id of the recipe to retrieve"
      example: "725608"
      default: '725608'
      required: true
      selector:
        text:

lookup_product:
  fields:
    identifier:
      name: "Barcode"
      description: "EAN/gtin/Barcode"
      example: "7300400375504"
      required: true
      selector:
        text:

get_baseitems:
  fields:
    integration:
      name: "ICA Account"
      required: true
      selector:
        config_entry:
          integration: ica

add_baseitem:
  fields:
    integration:
      name: "ICA Account"
      required: true
      selector:
        config_entry:
          integration: ica
    identifier:
      name: "Name / Barcode"
      description: "Either a free text name or a Barcode"
      example: "7300400375504"
      default: ''
      required: true
      selector:
        text:

upsert_shopping_list:
  fields:
    entity_id:
      name: "Shopping list entity"
      description: "The shopping list entity to add to"
      required: true
      selector:
        entity:
          filter:
            integration: ica
            domain: todo
          exclude_entities:
            - todo.ica_favorite_articles
          multiple: false
    rows:
      name: "Rows"
      description: "The rows to add/update in the shopping list (either the raw text or JSON object)"
      example: 'Lasagneplattor\n\r{"productName": "Banan", "productEan": "4011800420710", "offer_id": "2000681790", "quantity": 2, "unit": "st", "recipies": [{"id": "722982", "quantity": 1, "unit": "st"}]}'
      required: true
      selector:
        text:
          multiple: true
    conflict_mode:
      name: "Conflict mode"
      description: "What do to if the item already exists"
      default: 'APPEND'
      selector:
        select:
          options:
            - "APPEND"
            - "MERGE"
            - "IGNORE"

add_offers_to_shopping_list:
  fields:
    entity_id:
      name: "Shopping list entity"
      description: "The shopping list entity to add to"
      required: true
      selector:
        entity:
          filter:
            integration: ica
            domain: todo
          exclude_entities:
            - todo.ica_favorite_articles
          multiple: false
    offer_ids:
      name: "OfferIds"
      description: "The offer id(s) to add to a shopping list"
      example: "2000681790, 2000698334"
      required: true
      selector:
        text:
          multiple: true
    conflict_mode:
      name: "Conflict mode"
      description: "What do to if the item already exists"
      default: 'APPEND'
      selector:
        select:
          options:
            - "APPEND"
            - "MERGE"
            - "IGNORE"

get_offers:
  fields:
    integration:
      name: "ICA Account"
      description: "The ICA account to get offers for. Defaults to the first account"
      required: false
      selector:
        config_entry:
          integration: ica
    store_ids:
      name: "Store ids"
      description: "Only include offers valid in these stores. Leave empty for all favorite stores"
      example: "12805"
      required: false
      selector:
        text:
          multiple: true
    favorites_only:
      name: "Favorites only"
      description: "Only include offers that match the account's favorite items"
      default: false
      required: false
      selector:
        boolean:
